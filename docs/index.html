<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление волейболом</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; }
        .section { display: none; margin-bottom: 20px; }
        .section.active { display: block; }
        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; font-size: 13px; color: gray; margin-bottom: 4px; }
        select, input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; background: var(--tg-theme-secondary-bg-color, #f5f5f5); color: inherit; }
        button { background-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; padding: 12px 20px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 15px; }
        .status-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.05); text-align: center; }
        .tab-switcher { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 8px; background: var(--tg-theme-secondary-bg-color, #e0e0e0); color: inherit; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .tab-btn.active { background: var(--tg-theme-button-color, #2481cc); color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tab-switcher" id="tabSwitcher" style="display: none;">
            <button class="tab-btn active" onclick="switchTab('signup', event)">Запись</button>
            <button class="tab-btn" onclick="switchTab('create', event)">Создать анонс</button>
        </div>
        <div id="signupSection" class="section active">
            <h2>Волейбольный матч</h2>
            <div id="user-info">Загрузка данных...</div>
            <div id="status-container" class="status-box" style="display: none;">
                <p id="status-text"></p>
                <p id="payment-text"></p>
            </div>
            <button id="action-btn" style="display: none;">Записаться</button>
        </div>
        <div id="createSection" class="section">
            <h2>🏐 Создать анонс</h2>
            <form id="gameForm">
                <div class="form-group"><label>Группа:</label><select id="chatSelect" required><option value="">Загрузка...</option></select></div>
                <div class="form-group"><label>Дата:</label><input type="date" id="gameDate" required></div>
                <div class="form-group"><label>Начало:</label><input type="time" id="startTime" required></div>
                <div class="form-group"><label>Конец:</label><input type="time" id="endTime" required></div>
                <div class="form-group"><label>Публикация:</label><select id="publishTime" required><option value="now">Сразу</option><option value="1h">За 1 час</option></select></div>
                <div class="form-group"><label>Площадка:</label><input type="text" id="locName" required></div>
                <div class="form-group"><label>Карта (https://):</label><input type="url" id="locLink" required></div>
                <div class="form-group"><label>Стоимость:</label><input type="text" id="cost" required></div>
                <div class="form-group"><label>Максимум игроков:</label><input type="number" id="maxPlayers" value="12" min="2" max="30" required></div>
                <div class="form-group"><label>Организатор:</label><input type="text" id="orgName" required></div>
                <div class="form-group"><label>Телефон:</label><input type="tel" id="orgPhone" required></div>
                <button type="submit">Опубликовать</button>
            </form>
        </div>
    </div>
    <script>
        function switchTab(tab, evt) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'signup') {
                document.getElementById('signupSection').classList.add('active');
                evt.target.classList.add('active');
            } else {
                document.getElementById('createSection').classList.add('active');
                evt.target.classList.add('active');
            }
        }
    </script>
    <script type="module">
        import { initRouter } from './js/core/router_ui.js';
        import { initSignups } from './js/modules/signups.js';
        import './js/modules/announcements.js';
        document.addEventListener("DOMContentLoaded", async () => {
            await initRouter();
            await initSignups();
        });
    </script>
</body>
</html>
