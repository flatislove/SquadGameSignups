<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню бота</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/match-and-menu.css">
</head>
<body>
    <div id="mainMenuView" class="container">
        <div class="menu-list">
            <button type="button" id="menu-game" data-open-section="gameSection" class="menu-item">
                <span>🎮 Игра</span>
                <span>➔</span>
            </button>
            <button type="button" id="menu-my-signups" data-open-section="mySignupsSection" class="menu-item">
                <span>📝 Запись</span>
                <span>➔</span>
            </button>
            <a href="index.html?view=create" class="menu-item">
                <span>📢 Анонсы</span>
                <span>➔</span>
            </a>
            <button type="button" data-open-section="reportsSection" class="menu-item">
                <span>📊 Отчёты</span>
                <span class="badge">Скоро</span>
            </button>
            <button type="button" data-open-section="settingsSection" class="menu-item">
                <span>⚙️ Настройки</span>
                <span class="badge">Скоро</span>
            </button>
        </div>
    </div>
    <!-- 2. Запись (Мои записи) -->
    <div id="mySignupsSection" class="section-view" role="dialog" aria-modal="true" aria-labelledby="mySignupsTitle">
        <div class="section-inner">
            <div class="section-header">
                <button type="button" class="back-btn" data-back-to-menu>← Назад</button>
                <h3 id="mySignupsTitle" class="section-title">📝 Мои записи</h3>
            </div>
            <div class="section-body">
                <div id="mySignupsList" class="empty-placeholder">Загрузка ваших записей...</div>
            </div>
        </div>
    </div>

    <!-- 4. Отчёты -->
    <div id="reportsSection" class="section-view" role="dialog" aria-modal="true" aria-labelledby="reportsTitle">
        <div class="section-inner">
            <div class="section-header">
                <button type="button" class="back-btn" data-back-to-menu>← Назад</button>
                <h3 id="reportsTitle" class="section-title">📊 Отчёты</h3>
            </div>
            <div class="section-body">
                <div class="empty-placeholder">Раздел в разработке.</div>
            </div>
        </div>
    </div>

    <!-- 5. Настройки -->
    <div id="settingsSection" class="section-view" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="section-inner">
            <div class="section-header">
                <button type="button" class="back-btn" data-back-to-menu>← Назад</button>
                <h3 id="settingsTitle" class="section-title">⚙️ Настройки</h3>
            </div>
            <div class="section-body">
                <div class="empty-placeholder">Раздел в разработке.</div>
            </div>
    <!-- 6. Игра -->
    <div id="gameSection" class="section-view" role="dialog" aria-modal="true" aria-labelledby="gameTitle">
        <div class="section-inner">
            <div class="section-header">
                <button type="button" class="back-btn" data-back-to-menu>← Назад</button>
                <h3 id="gameTitle" class="section-title">🎮 Игра</h3>
            </div>
            <div class="section-body">
                <div style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 14px; margin-bottom: 6px; color: inherit;">Выберите игру:</label>
                    <select id="gameSelect" style="width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(128, 128, 128, 0.16); background: var(--tg-theme-secondary-bg-color, #f5f5f5); color: inherit; font-size: 14px;">
                        <option value="">Загрузка игр...</option>
                    </select>
                </div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button type="button" id="btnGameStart" style="width: 100%; padding: 14px 16px; border-radius: 10px; border: none; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); font-weight: bold; font-size: 15px; cursor: pointer;">
                        ▶ Старт матча
                    </button>
                    <button type="button" id="btnGameSettings" style="width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid rgba(128, 128, 128, 0.16); background: var(--tg-theme-secondary-bg-color, #f5f5f5); color: inherit; font-weight: bold; font-size: 15px; cursor: pointer; display: none;">
                        ⚙️ Настройки состава и действий
                    </button>
                </div>
                <div id="gameInfo" style="margin-top: 16px; padding: 12px; border-radius: 10px; background: var(--tg-theme-secondary-bg-color, #f5f5f5); font-size: 13px; color: inherit; display: none;"></div>
            </div>
        </div>
    </div>

    <!-- 7. Настройки состава и действий -->
    <div id="gameSettingsSection" class="section-view" role="dialog" aria-modal="true" aria-labelledby="gameSettingsTitle">
        <div class="section-inner">
            <div class="section-header">
                <button type="button" class="back-btn" data-back-to-game>← Назад к игре</button>
                <h3 id="gameSettingsTitle" class="section-title">⚙️ Настройки игры</h3>
            </div>
            <div class="section-body">
                <div id="gameSettingsError" style="color: #d9534f; font-size: 13px; margin-bottom: 10px; display: none;"></div>

                <!-- Игроки -->
                <div style="margin-bottom: 14px;">
                    <div style="font-weight: bold; margin-bottom: 6px;">👥 Игроки в игре</div>
                    <div id="playersList" style="display: flex; flex-direction: column; gap: 6px;"></div>
                </div>

                <!-- Команды -->
                <div style="margin-bottom: 14px;">
                    <div style="font-weight: bold; margin-bottom: 6px;">🏆 Команды (перетаскивайте игроков)</div>
                    <div id="teamsContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
                    <button type="button" id="btnSaveTeams" style="width: 100%; padding: 10px; border-radius: 8px; border: none; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); font-weight: bold; cursor: pointer;">💾 Сохранить команды и составы</button>
                </div>

                <!-- Действия сообщества -->
                <div>
                    <div style="font-weight: bold; margin-bottom: 6px;">⚡ Действия сообщества</div>
                    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                        <input type="text" id="newActionTitle" placeholder="Название действия" style="flex: 1; padding: 8px; border-radius: 8px; border: 1px solid rgba(128,128,128,0.16); background: var(--tg-theme-secondary-bg-color, #f5f5f5); color: inherit; font-size: 14px;">
                        <input type="number" id="newActionWeight" placeholder="Вес" step="0.5" style="width: 80px; padding: 8px; border-radius: 8px; border: 1px solid rgba(128,128,128,0.16); background: var(--tg-theme-secondary-bg-color, #f5f5f5); color: inherit; font-size: 14px;">
                        <button type="button" id="btnAddAction" style="padding: 8px 14px; border-radius: 8px; border: none; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); font-weight: bold; cursor: pointer;">+</button>
                    </div>
                    <div id="actionsList" style="display: flex; flex-direction: column; gap: 6px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initNavigation } from './js/menu/navigation.js';
        document.addEventListener('DOMContentLoaded', () => {
            initNavigation();
        });
    </script>
</body>
</html>

        </div>
    </div>
