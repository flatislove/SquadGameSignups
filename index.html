<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на матч</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h4 id="groupTitle" class="text-center mb-3">Загрузка...</h4>
        
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
        </div>

        <div id="appContent" style="display: none;">
            <div class="card shadow-sm mb-3">
                <div class="card-body text-center">
                    <h5 id="statusText" class="card-title mb-3"></h5>
                    <div id="actionContainer"></div>
                </div>
            </div>

            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">Основной состав (<span id="playersCount">0</span>/<span id="maxPlayers">0</span>)</h6>
                    <ul id="playersList" class="list-group list-group-flush mb-3"></ul>
                    
                    <h6 class="card-subtitle mb-2 text-muted">Резерв</h6>
                    <ul id="reserveList" class="list-group list-group-flush"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');
        const user = tg.initDataUnsafe?.user;
        const backendUrl = "https://squadgamesignups.onrender.com";

        if (!user || !chatId) {
            document.body.innerHTML = "<div class='container p-4 text-center text-danger'>Ошибка доступа. Откройте приложение из чата.</div>";
        } else {
            loadData();
        }

        function loadData() {
            fetch(`${backendUrl}/api/match?chat_id=${chatId}&user_id=${user.id}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('appContent').style.display = 'block';
                    
                    document.getElementById('groupTitle').innerText = data.group_title;
                    document.getElementById('playersCount').innerText = data.players_count;
                    document.getElementById('maxPlayers').innerText = data.max_players;

                    document.getElementById('playersList').innerHTML = data.players.map((p, idx) => 
                        `<li class="list-group-item d-flex justify-content-between align-items-center">${idx + 1}. ${p.name} ${p.paid ? '🟩' : '🟧'}</li>`
                    ).join('') || '<li class="list-group-item text-muted">Пусто</li>';

                    document.getElementById('reserveList').innerHTML = data.reserve.map((r, idx) => 
                        `<li class="list-group-item">${idx + 1}. ${r.name}</li>`
                    ).join('') || '<li class="list-group-item text-muted">Пусто</li>';

                    const actionContainer = document.getElementById('actionContainer');
                    const statusText = document.getElementById('statusText');

                    if (data.user_status === 'player') {
                        statusText.innerText = data.is_paid ? "Вы в основе (Оплачено 🟩)" : "Вы в основе (Не оплачено 🟧)";
                        actionContainer.innerHTML = `<button class="btn btn-danger w-100" onclick="confirmCancel()">Отписаться от матча</button>`;
                    } else if (data.user_status === 'reserve') {
                        statusText.innerText = "Вы находитесь в резерве.";
                        actionContainer.innerHTML = `<button class="btn btn-warning w-100" onclick="sendAction('cancel')">Выйти из резерва</button>`;
                    } else {
                        statusText.innerText = "Вы не записаны.";
                        actionContainer.innerHTML = `<button class="btn btn-success w-100" onclick="sendAction('signup')">Записаться</button>`;
                    }
                });
        }

        function confirmCancel() {
            tg.showConfirm("Вы уверены, что хотите отписаться? Ваше место может занять другой человек.", (confirmed) => {
                if (confirmed) sendAction('cancel');
            });
        }

        function sendAction(action) {
            fetch(`${backendUrl}/api/action`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    user_id: user.id,
                    full_name: user.first_name + (user.last_name ? ' ' + user.last_name : ''),
                    username: user.username,
                    action: action
                })
            }).then(res => res.json()).then(data => {
                if (data.status === 'ok') loadData();
            });
        }
    </script>
</body>
</html>
